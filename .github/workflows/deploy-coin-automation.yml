name: Deploy coin-automation to VPS

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  SERVICE_NAME: coin-automation

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical
          infisical --version

      - name: Fetch VPS credentials
        id: vps
        run: |
          export INFISICAL_TOKEN=$(infisical login --method=universal-auth --client-id="${{ secrets.INFISICAL_CLIENT_ID }}" --client-secret="${{ secrets.INFISICAL_CLIENT_SECRET }}" --plain --silent)
          VPS_HOST=$(infisical secrets get VPS_HOST --projectId "${{ secrets.INFISICAL_PROJECT_ID_VPS_AUTH }}" --path /instances/COIN_AUTOMATION_VPS --env prod --plain --silent)
          VPS_USERNAME=$(infisical secrets get VPS_USERNAME --projectId "${{ secrets.INFISICAL_PROJECT_ID_VPS_AUTH }}" --path /instances/COIN_AUTOMATION_VPS --env prod --plain --silent)
          VPS_PASSWORD=$(infisical secrets get VPS_PASSWORD --projectId "${{ secrets.INFISICAL_PROJECT_ID_VPS_AUTH }}" --path /instances/COIN_AUTOMATION_VPS --env prod --plain --silent)
          VPS_PORT=$(infisical secrets get VPS_PORT --projectId "${{ secrets.INFISICAL_PROJECT_ID_VPS_AUTH }}" --path /instances/COIN_AUTOMATION_VPS --env prod --plain --silent)
          VPS_COIN_AUTOMATION_DIR=$(infisical secrets get VPS_COIN_AUTOMATION_DIR --projectId "${{ secrets.INFISICAL_PROJECT_ID_VPS_AUTH }}" --path /instances/COIN_AUTOMATION_VPS --env prod --plain --silent)
          echo "VPS_HOST=$VPS_HOST" >> $GITHUB_OUTPUT
          echo "VPS_USERNAME=$VPS_USERNAME" >> $GITHUB_OUTPUT
          echo "VPS_PORT=$VPS_PORT" >> $GITHUB_OUTPUT
          echo "VPS_COIN_AUTOMATION_DIR=$VPS_COIN_AUTOMATION_DIR" >> $GITHUB_OUTPUT
          echo "::add-mask::$VPS_PASSWORD"
          echo "VPS_PASSWORD=$VPS_PASSWORD" >> $GITHUB_OUTPUT

      - name: Prepare app config
        id: app
        run: |
          echo "INFISICAL_PROJECT_ID_APP=${{ secrets.INFISICAL_PROJECT_ID_APP }}" >> $GITHUB_OUTPUT

      - name: Install and connect Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          export INFISICAL_TOKEN=$(infisical login --method=universal-auth --client-id="${{ secrets.INFISICAL_CLIENT_ID }}" --client-secret="${{ secrets.INFISICAL_CLIENT_SECRET }}" --plain --silent)
          TAILSCALE_KEY=$(infisical secrets get TAILSCALE_AUTH_KEY --projectId "${{ secrets.INFISICAL_PROJECT_ID_VPS_AUTH }}" --path /shared --env prod --plain --silent)
          if [ -z "$TAILSCALE_KEY" ]; then
            echo "::error::TAILSCALE_AUTH_KEY is empty"
            exit 1
          fi
          sudo tailscale up --auth-key="$TAILSCALE_KEY"

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ steps.vps.outputs.VPS_PORT }} ${{ steps.vps.outputs.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.vps.outputs.VPS_HOST }}
          username: ${{ steps.vps.outputs.VPS_USERNAME }}
          password: ${{ steps.vps.outputs.VPS_PASSWORD }}
          port: ${{ steps.vps.outputs.VPS_PORT }}
          debug: true
          script: |
            powershell -NoProfile -ExecutionPolicy Bypass -Command "
            $ErrorActionPreference = 'Stop'
            function Check-ExitCode($stepName) {
                if ($LASTEXITCODE -ne 0) {
                    Write-Host \"ERROR: $stepName failed with exit code $LASTEXITCODE\"
                    exit 1
                }
            }
            try {
                Write-Host '[STEP 1] cd + git reset'
                Set-Location '${{ steps.vps.outputs.VPS_COIN_AUTOMATION_DIR }}'
                git reset --hard HEAD
                Check-ExitCode 'git reset'

                Write-Host '[STEP 2] git pull'
                git pull origin main
                Check-ExitCode 'git pull'

                Write-Host '[STEP 3] capture deployed commit'
                $deployedSha = (git rev-parse HEAD)
                Check-ExitCode 'git rev-parse'
                Write-Host \"Deployed commit: $deployedSha\"

                Write-Host '[STEP 4] drain in-flight orders on the running instance'
                try {
                    $r = Invoke-RestMethod -Uri 'http://localhost:8000/drain' -Method Post -TimeoutSec 110 -UseBasicParsing
                    Write-Host ('Drain result: ' + ($r | ConvertTo-Json -Compress))
                } catch {
                    Write-Host 'No running instance to drain, continuing'
                }

                Write-Host '[STEP 5] kill old process (and its child processes, e.g. browser)'
                Get-Process python -ErrorAction SilentlyContinue | ForEach-Object {
                    Write-Host ('Killing PID ' + $_.Id + ' and its child tree')
                    taskkill /PID $_.Id /F /T
                }

                Write-Host '[STEP 6] pip install'
                & '.venv\Scripts\python.exe' -m pip install -r requirements.txt
                Check-ExitCode 'pip install'

                Write-Host '[STEP 7] setx env vars'
                setx INFISICAL_CLIENT_ID '${{ secrets.INFISICAL_CLIENT_ID }}' /M
                Check-ExitCode 'setx CLIENT_ID'
                setx INFISICAL_CLIENT_SECRET '${{ secrets.INFISICAL_CLIENT_SECRET }}' /M
                Check-ExitCode 'setx CLIENT_SECRET'
                setx INFISICAL_PROJECT_ID '${{ steps.app.outputs.INFISICAL_PROJECT_ID_APP }}' /M
                Check-ExitCode 'setx PROJECT_ID'
                setx INFISICAL_ENVIRONMENT 'prod' /M
                Check-ExitCode 'setx ENV'
                setx INFISICAL_SECRET_PATH '/coin-automation' /M
                Check-ExitCode 'setx SECRET_PATH'
                setx GIT_COMMIT $deployedSha /M
                Check-ExitCode 'setx GIT_COMMIT'

                Write-Host '[STEP 8] schtasks create'
                schtasks /create /tn coin-automation /tr 'C:\coin\coin-automation\.venv\Scripts\python.exe C:\coin\coin-automation\run.py' /sc onlogon /ru Administrator /rp '${{ steps.vps.outputs.VPS_PASSWORD }}' /rl highest /it /f
                Check-ExitCode 'schtasks create'

                Write-Host '[STEP 9] schtasks run'
                schtasks /run /tn coin-automation
                Check-ExitCode 'schtasks run'

                Write-Host '[STEP 10] health check (must be new commit, not a stale instance still answering)'
                $ok = $false
                for ($i = 0; $i -lt 12; $i++) {
                    Start-Sleep -Seconds 5
                    try {
                        $health = Invoke-RestMethod -Uri 'http://localhost:8000/health' -TimeoutSec 3 -UseBasicParsing
                        if ($health.status -eq 'ok' -and $health.commit -eq $deployedSha) {
                            $ok = $true
                            Write-Host 'HEALTH_OK'
                            break
                        } elseif ($health.status -eq 'ok') {
                            Write-Host ('Got mismatched commit: ' + $health.commit + ' expected ' + $deployedSha)
                        }
                    } catch {}
                }
                if (-not $ok) {
                    Write-Host 'ERROR: health check failed: instance running expected commit did not come up within 60s'
                    exit 1
                }
            } catch {
                Write-Host \"ERROR: deploy failed: $_\"
                exit 1
            }
            "

      - name: Telegram notify
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            coin-automation deploy ${{ job.status }}
            Tag: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
