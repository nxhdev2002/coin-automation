name: Deploy coin-automation to VPS

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

env:
  SERVICE_NAME: coin-automation

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical
          infisical --version

      - name: Fetch VPS credentials
        id: vps
        run: |
          export INFISICAL_TOKEN=$(infisical login --method=universal-auth --client-id="${{ secrets.INFISICAL_CLIENT_ID }}" --client-secret="${{ secrets.INFISICAL_CLIENT_SECRET }}" --plain --silent)
          VPS_HOST=$(infisical secrets get VPS_HOST --projectId "${{ secrets.INFISICAL_PROJECT_ID_VPS_AUTH }}" --path /instances/COIN_AUTOMATION_VPS --env prod --plain --silent)
          VPS_USERNAME=$(infisical secrets get VPS_USERNAME --projectId "${{ secrets.INFISICAL_PROJECT_ID_VPS_AUTH }}" --path /instances/COIN_AUTOMATION_VPS --env prod --plain --silent)
          VPS_PASSWORD=$(infisical secrets get VPS_PASSWORD --projectId "${{ secrets.INFISICAL_PROJECT_ID_VPS_AUTH }}" --path /instances/COIN_AUTOMATION_VPS --env prod --plain --silent)
          VPS_PORT=$(infisical secrets get VPS_PORT --projectId "${{ secrets.INFISICAL_PROJECT_ID_VPS_AUTH }}" --path /instances/COIN_AUTOMATION_VPS --env prod --plain --silent)
          VPS_COIN_AUTOMATION_DIR=$(infisical secrets get VPS_COIN_AUTOMATION_DIR --projectId "${{ secrets.INFISICAL_PROJECT_ID_VPS_AUTH }}" --path /instances/COIN_AUTOMATION_VPS --env prod --plain --silent)
          echo "VPS_HOST=$VPS_HOST" >> $GITHUB_OUTPUT
          echo "VPS_USERNAME=$VPS_USERNAME" >> $GITHUB_OUTPUT
          echo "VPS_PORT=$VPS_PORT" >> $GITHUB_OUTPUT
          echo "VPS_COIN_AUTOMATION_DIR=$VPS_COIN_AUTOMATION_DIR" >> $GITHUB_OUTPUT
          echo "::add-mask::$VPS_PASSWORD"
          echo "VPS_PASSWORD=$VPS_PASSWORD" >> $GITHUB_OUTPUT

      - name: Prepare app config
        id: app
        run: |
          echo "INFISICAL_PROJECT_ID_APP=${{ secrets.INFISICAL_PROJECT_ID_APP }}" >> $GITHUB_OUTPUT

      - name: Install and connect Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          export INFISICAL_TOKEN=$(infisical login --method=universal-auth --client-id="${{ secrets.INFISICAL_CLIENT_ID }}" --client-secret="${{ secrets.INFISICAL_CLIENT_SECRET }}" --plain --silent)
          TAILSCALE_KEY=$(infisical secrets get TAILSCALE_AUTH_KEY --projectId "${{ secrets.INFISICAL_PROJECT_ID_VPS_AUTH }}" --path /shared --env prod --plain --silent)
          if [ -z "$TAILSCALE_KEY" ]; then
            echo "::error::TAILSCALE_AUTH_KEY is empty"
            exit 1
          fi
          sudo tailscale up --auth-key="$TAILSCALE_KEY"

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Add host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ steps.vps.outputs.VPS_PORT }} ${{ steps.vps.outputs.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ steps.vps.outputs.VPS_HOST }}
          username: ${{ steps.vps.outputs.VPS_USERNAME }}
          password: ${{ steps.vps.outputs.VPS_PASSWORD }}
          port: ${{ steps.vps.outputs.VPS_PORT }}
          script: |
            echo [STEP 1] git reset
            cd ${{ steps.vps.outputs.VPS_COIN_AUTOMATION_DIR }} || (echo ERROR: cd failed & exit 1)
            git reset --hard HEAD || (echo ERROR: git reset failed & exit 1)
            echo [STEP 2] git pull
            git pull origin main || (echo ERROR: git pull failed & exit 1)
            echo [STEP 3] capture deployed commit
            git rev-parse HEAD > deployed_commit.txt || (echo ERROR: git rev-parse failed & exit 1)
            echo [STEP 4] drain in-flight orders on the running instance
            powershell -Command "try { $r = Invoke-RestMethod -Uri http://localhost:8000/drain -Method Post -TimeoutSec 110 -UseBasicParsing; Write-Host ('Drain result: ' + ($r | ConvertTo-Json -Compress)) } catch { Write-Host 'No running instance to drain, continuing' }"
            echo [STEP 5] kill old process (and its child processes, e.g. browser)
            powershell -Command "Get-Process python -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ('Killing PID ' + $_.Id + ' and its child tree'); taskkill /PID $_.Id /F /T }"
            echo [STEP 6] pip install
            .venv\Scripts\python.exe -m pip install -r requirements.txt || (echo ERROR: pip install failed & exit 1)
            echo [STEP 7] setx env vars
            setx INFISICAL_CLIENT_ID "${{ secrets.INFISICAL_CLIENT_ID }}" /M || (echo ERROR: setx CLIENT_ID failed & exit 1)
            setx INFISICAL_CLIENT_SECRET "${{ secrets.INFISICAL_CLIENT_SECRET }}" /M || (echo ERROR: setx CLIENT_SECRET failed & exit 1)
            setx INFISICAL_PROJECT_ID "${{ steps.app.outputs.INFISICAL_PROJECT_ID_APP }}" /M || (echo ERROR: setx PROJECT_ID failed & exit 1)
            setx INFISICAL_ENVIRONMENT "prod" /M || (echo ERROR: setx ENV failed & exit 1)
            setx INFISICAL_SECRET_PATH "/coin-automation" /M || (echo ERROR: setx PATH failed & exit 1)
            powershell -Command "$sha = (Get-Content deployed_commit.txt -Raw).Trim(); setx GIT_COMMIT $sha /M" || (echo ERROR: setx GIT_COMMIT failed & exit 1)
            echo [STEP 8] schtasks create
            schtasks /create /tn coin-automation /tr "C:\coin\coin-automation\.venv\Scripts\python.exe C:\coin\coin-automation\run.py" /sc onlogon /ru Administrator /rp "${{ steps.vps.outputs.VPS_PASSWORD }}" /rl highest /it /f || (echo ERROR: schtasks create failed & exit 1)
            echo [STEP 9] schtasks run
            schtasks /run /tn coin-automation || (echo ERROR: schtasks run failed & exit 1)
            echo [STEP 10] health check (must be new commit, not a stale instance still answering)
            powershell -Command "$expected=(Get-Content deployed_commit.txt -Raw).Trim(); $ok=$false; for($i=0;$i -lt 12;$i++){Start-Sleep 5; try{$r=Invoke-RestMethod -Uri http://localhost:8000/health -TimeoutSec 3 -UseBasicParsing; if($r.status -eq 'ok' -and $r.commit -eq $expected){$ok=$true; Write-Host HEALTH_OK; break} elseif($r.status -eq 'ok'){Write-Host ('Got mismatched commit: ' + $r.commit + ' expected ' + $expected)}}catch{}}; if(-not $ok){Write-Error 'Health check failed: instance running expected commit did not come up within 60s'; exit 1}"

      - name: Telegram notify
        if: always()
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            coin-automation deploy ${{ job.status }}
            Tag: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
